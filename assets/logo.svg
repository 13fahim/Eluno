<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background Circle with Soft Gradient & Gold Rim -->
  <defs>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d37b"/>
      <stop offset="50%" stop-color="#d49a37"/>
      <stop offset="100%" stop-color="#b0761e"/>
    </linearGradient>
    <linearGradient id="goldFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce8a9"/>
      <stop offset="60%" stop-color="#e5a93b"/>
      <stop offset="100%" stop-color="#c68a1f"/>
    </linearGradient>
    <linearGradient id="navyWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14375e"/>
      <stop offset="100%" stop-color="#0a1d33"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Outer Circle Border -->
  <circle cx="250" cy="250" r="238" fill="#fdfbf7" stroke="url(#goldRim)" stroke-width="14" filter="url(#softGlow)"/>

  <!-- Golden Wing / Top Flame of 'E' -->
  <path d="M 215,90 C 275,85 330,135 305,200 C 270,185 240,165 215,90 Z" fill="url(#goldFlame)"/>

  <!-- Navy Main Body of stylized 'E' -->
  <path d="M 185,150 C 255,120 305,175 290,225 C 255,200 215,225 205,255 C 240,240 280,265 295,310 C 265,345 180,335 170,245 C 165,195 170,165 185,150 Z" fill="url(#navyWave)"/>

  <!-- Golden Heart Accent -->
  <path d="M 295,215 C 295,198 310,185 324,198 C 338,185 353,198 353,215 C 353,235 324,255 324,255 C 324,255 295,235 295,215 Z" fill="url(#goldFlame)"/>

  <!-- Brand Typography: "Eluno" -->
  <text x="250" y="380" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="78" fill="#0b2340" text-anchor="middle" letter-spacing="-1.5">Eluno</text>

  <!-- Slogan: "Made for Little Moments." -->
  <text x="250" y="425" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-weight="600" font-size="27" fill="#0b2340" text-anchor="middle" letter-spacing="0.5">Made for Little Moments.</text>

  <!-- Golden Heart Divider below Slogan -->
  <line x1="165" y1="448" x2="225" y2="448" stroke="url(#goldRim)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 242,444 C 242,439 246,435 250,439 C 254,435 258,439 258,444 C 258,449 250,455 250,455 C 250,455 242,449 242,444 Z" fill="url(#goldFlame)"/>
  <line x1="275" y1="448" x2="335" y2="448" stroke="url(#goldRim)" stroke-width="3" stroke-linecap="round"/>
</svg>
